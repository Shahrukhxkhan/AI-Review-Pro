name: AI Review Pro - Automated PR Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run AI Review Pro on Pull Request Diff
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_REVIEW_API_URL: ${{ secrets.AI_REVIEW_API_URL || 'http://localhost:3000/api/review' }}
        run: |
          # Grab unified diff against the target branch
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff

          # Execute CLI audit in markdown mode and capture output
          node bin/cli.mjs --file pr.diff --persona security --markdown > review-comment.md

      - name: Post Comment to Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync('review-comment.md', 'utf-8');
            
            // Post new review comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
